<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta property="og:site_name" content="Simple Calculator" />
  <meta name="google-site-verification" content="M6YVifcPRESmN6mI3KLKEQlS5uCnSSgyQyt8UlJSpiA" />
</head>
<body>
  <main class="calc-shell" role="application" aria-label="Scientific calculator">

    <div class="brand-plate">
      <span class="brand">NOVA <span class="brand-thin">calc</span></span>
      <span class="brand-sub">Scientific Calculator&nbsp;&middot;&nbsp;NX-100</span>
    </div>
    
    <div class="screen">
      <div class="screen-status">
        <span id="badgeAngle" class="badge">DEG</span>
        <span id="badgeShift" class="badge hidden">2ND</span>
        <span id="badgeMem" class="badge hidden">M</span>
      </div>
      <div id="display" class="screen-main" tabindex="0" aria-line="polite">o</div>
    </div>
     <div class="control-row">
      <div class="control-cluster">
        <button id="shiftBtn" data-action="shift" class="ctrl-btn">SHIFT</button>
        <button id="angleBtn" data-action="angle" class="ctrl-btn">DEG</button>
      </div>

        <div class="dpad" role="group" aria-label="Cursor and quick actions">
        <button class="dpad-btn dpad-up" data-dir="up" title="Ans">▲</button>
        <button class="dpad-btn dpad-left" data-dir="left" title="Move left">◀</button>
        <button class="dpad-btn dpad-center" data-action="equals" title="Equals">OK</button>
        <button class="dpad-btn dpad-right" data-dir="right" title="Move right">▶</button>
        <button class="dpad-btn dpad-down" data-dir="down" title="Memory recall">▼</button>
      </div>

      <div class="control-cluster">
        <button data-action="back" class="ctrl-btn del">DEL</button>
        <button data-action="clear" class="ctrl-btn ac">AC</button>
      </div>
    </div>

    <div class="keypad">
      <button class="key" data-action="reciprocal"><span class="key-sub">&nbsp;</span><span class="key-main">1/x</span></button>
      <button class="key" data-insert="^2"><span class="key-sub">&nbsp;</span><span class="key-main">x²</span></button>
      <button class="key" data-insert="^3"><span class="key-sub">&nbsp;</span><span class="key-main">x³</span></button>
      <button class="key" data-insert="^"><span class="key-sub">&nbsp;</span><span class="key-main">xʸ</span></button>
      <button class="key" data-insert="sqrt(" data-shift-insert="cbrt(" data-label="√" data-shift-label="³√"><span class="key-sub">³√</span><span class="key-main">√</span></button>

      <button class="key" data-insert="log(" data-shift-insert="10^(" data-label="log" data-shift-label="10ˣ"><span class="key-sub">10ˣ</span><span class="key-main">log</span></button>
      <button class="key" data-insert="ln(" data-shift-insert="e^(" data-label="ln" data-shift-label="eˣ"><span class="key-sub">eˣ</span><span class="key-main">ln</span></button>
      <button class="key" data-insert="sin(" data-shift-insert="asin(" data-label="sin" data-shift-label="sin⁻¹"><span class="key-sub">sin⁻¹</span><span class="key-main">sin</span></button>
      <button class="key" data-insert="cos(" data-shift-insert="acos(" data-label="cos" data-shift-label="cos⁻¹"><span class="key-sub">cos⁻¹</span><span class="key-main">cos</span></button>
      <button class="key" data-insert="tan(" data-shift-insert="atan(" data-label="tan" data-shift-label="tan⁻¹"><span class="key-sub">tan⁻¹</span><span class="key-main">tan</span></button>

      <button class="key" data-insert="("><span class="key-sub">&nbsp;</span><span class="key-main">(</span></button>
      <button class="key" data-insert=")"><span class="key-sub">&nbsp;</span><span class="key-main">)</span></button>
      <button class="key" data-insert="π"><span class="key-sub">&nbsp;</span><span class="key-main">π</span></button>
      <button class="key" data-insert="e"><span class="key-sub">&nbsp;</span><span class="key-main">e</span></button>
      <button class="key" data-insert="%"><span class="key-sub">&nbsp;</span><span class="key-main">%</span></button>

      <button class="key" data-action="mc"><span class="key-sub">&nbsp;</span><span class="key-main">MC</span></button>
      <button class="key" data-action="mr"><span class="key-sub">&nbsp;</span><span class="key-main">MR</span></button>
      <button class="key" data-action="mplus"><span class="key-sub">&nbsp;</span><span class="key-main">M+</span></button>
      <button class="key" data-action="mminus"><span class="key-sub">&nbsp;</span><span class="key-main">M−</span></button>
      <button class="key" data-insert="!"><span class="key-sub">&nbsp;</span><span class="key-main">x!</span></button>

      <button class="key num" data-value="7"><span class="key-main">7</span></button>
      <button class="key num" data-value="8"><span class="key-main">8</span></button>
      <button class="key num" data-value="9"><span class="key-main">9</span></button>
      <button class="key op" data-value="×"><span class="key-main">×</span></button>
      <button class="key op" data-value="÷"><span class="key-main">÷</span></button>

      <button class="key num" data-value="4"><span class="key-main">4</span></button>
      <button class="key num" data-value="5"><span class="key-main">5</span></button>
      <button class="key num" data-value="6"><span class="key-main">6</span></button>
      <button class="key op" data-value="-"><span class="key-main">−</span></button>
      <button class="key op" data-value="+"><span class="key-main">+</span></button>

      <button class="key num" data-value="1"><span class="key-main">1</span></button>
      <button class="key num" data-value="2"><span class="key-main">2</span></button>
      <button class="key num" data-value="3"><span class="key-main">3</span></button>
      <button class="key" data-action="toggle-sign"><span class="key-main">±</span></button>
      <button class="key" data-insert="*10^("><span class="key-main">EXP</span></button>

      <button class="key num wide" data-value="0"><span class="key-main">0</span></button>
      <button class="key num" data-value="."><span class="key-main">.</span></button>
      <button class="key" data-action="ans"><span class="key-main">Ans</span></button>
      <button class="key equals" data-action="equals"><span class="key-main">=</span></button>
    </div>

    <p class="hint">Keyboard: numbers, +-*/, Enter, Backspace, arrow keys, Esc.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
